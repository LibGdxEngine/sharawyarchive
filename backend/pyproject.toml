[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.dev"
python_files = ["test_*.py"]
testpaths = ["accounts", "api", "clips", "corpus", "quran", "search"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "I001", "UP", "B"]
# Layered Django settings: `from .base import *` is the intended pattern here.
"core/settings/dev.py" = ["F403", "F405"]
"core/settings/prod.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/"]
