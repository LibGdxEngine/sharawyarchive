openapi: 3.0.3
info:
  title: Sha'rawy Archive API
  version: 1.0.0
  description: 'Read API for the Sha''rawy Archive: the Quran text, the audio corpus
    (segments, machine transcripts, chunks), search, topics, plus correction submissions
    and clip render jobs. All timestamps are integer milliseconds. Audio and waveform
    URLs are presigned and short-lived; raw storage keys never leave the backend.'
paths:
  /api/ayahs/{surah}/{ayah}/:
    get:
      operationId: ayah_retrieve
      description: |-
        ``GET /api/ayahs/{surah}/{ayah}/`` — the verse and the segments whose
        declared ayah range covers it. A segment with no range covers nothing.
      parameters:
      - in: path
        name: ayah
        schema:
          type: integer
        required: true
      - in: path
        name: surah
        schema:
          type: integer
        required: true
      tags:
      - ayahs
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AyahDetail'
          description: ''
  /api/clips/:
    post:
      operationId: clip_create
      description: |-
        ``POST /api/clips/`` — enqueue a render, or hand back the one that is
        already running.

        The (segment, range, preset) tuple is unique, which makes the job table its
        own cache: the second person to share the same passage joins the first
        person's render instead of starting another. ``202`` means "queued by you",
        ``200`` means "already queued".

        The one job that is *not* simply handed back is a failed one: asking for it
        again queues one more attempt on the same row, so a transient worker or
        storage failure is not a clip nobody can ever have.
      tags:
      - clips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClipCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClipCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipStatus'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipStatus'
          description: ''
  /api/clips/{id}/:
    get:
      operationId: clips_retrieve
      description: '``GET /api/clips/{id}/`` — poll a job. Never cached: status moves.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clips
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipDetail'
          description: ''
  /api/clips/{id}/download/:
    get:
      operationId: clips_download_retrieve
      description: |-
        ``GET /api/clips/{id}/media/`` and ``.../download/`` — the clip bytes.

        Both redirect to a freshly presigned object URL rather than answering with
        one, which buys two things a presigned URL in a JSON body cannot:

        * **The link never rots.** A presigned URL dies in six hours, and these
          addresses are the ones that get shared, embedded in OpenGraph metadata and
          pasted into chats.
        * **The download actually downloads.** The bucket is a different origin from
          the site, and HTML ignores ``download`` on a cross-origin anchor. The
          attachment disposition is signed into the redirect target instead, so the
          browser saves the file whatever the anchor says.

        ``as_attachment`` is what separates the two routes: the clip page plays the
        same object inline, and an attachment disposition would fight that.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clips
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '302':
          description: redirect to the clip object
        '404':
          description: no such clip, or not rendered yet
  /api/clips/{id}/media/:
    get:
      operationId: clips_media_retrieve
      description: |-
        ``GET /api/clips/{id}/media/`` and ``.../download/`` — the clip bytes.

        Both redirect to a freshly presigned object URL rather than answering with
        one, which buys two things a presigned URL in a JSON body cannot:

        * **The link never rots.** A presigned URL dies in six hours, and these
          addresses are the ones that get shared, embedded in OpenGraph metadata and
          pasted into chats.
        * **The download actually downloads.** The bucket is a different origin from
          the site, and HTML ignores ``download`` on a cross-origin anchor. The
          attachment disposition is signed into the redirect target instead, so the
          browser saves the file whatever the anchor says.

        ``as_attachment`` is what separates the two routes: the clip page plays the
        same object inline, and an attachment disposition would fight that.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clips
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '302':
          description: redirect to the clip object
        '404':
          description: no such clip, or not rendered yet
  /api/corrections/:
    post:
      operationId: correction_create
      description: |-
        ``POST /api/corrections/`` — anonymous, IP-throttled suggestion inbox.

        Nothing here touches the transcript: a correction is reviewed and applied
        by a human later (Phase 6). The response is a bare receipt so a submitter
        cannot use the endpoint to enumerate the queue.
      tags:
      - corrections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CorrectionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionCreated'
          description: ''
  /api/search/:
    get:
      operationId: search_retrieve
      description: |-
        ``GET /api/search/?q=&kind=&surah=&page=`` (API_CONTRACT.md).

        Never cached: results move with every pipeline run.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        required: true
      - in: query
        name: surah
        schema:
          type: integer
      tags:
      - search
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/search/suggest/:
    get:
      operationId: search_suggest
      description: |-
        ``GET /api/search/suggest/?q=&kind=`` — autocomplete suggestions.

        ``kind`` scopes suggestions to the selected content (recitation → mushaf
        text, khawatir → khawatir transcript snippets). Returns a plain list of
        strings (matched text snippets). Never cached; results move with every
        pipeline run.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        required: true
      tags:
      - search
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
  /api/segments/{id}/:
    get:
      operationId: segments_retrieve
      description: |-
        ``GET /api/segments/{id}/`` — metadata plus presigned media URLs.

        Not immutable, despite the rest of the segment being append-only: the body
        embeds presigned audio and waveform URLs that expire in six hours, so it is
        ``private`` (a shared cache must not hand one reader's signed URL to
        another) and short-lived (API_CONTRACT.md amendment 4).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - segments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentDetail'
          description: ''
  /api/segments/{id}/chunks/:
    get:
      operationId: segment_chunks_list
      description: |-
        ``GET /api/segments/{id}/chunks/`` — passage spans and their word ranges.

        The client already has the word array from ``/transcript/``; this says
        which passage each word belongs to, which is what a correction has to name
        when it is submitted. Short-lived cache, NOT immutable: the URL carries no
        transcript version, and an approved correction can renumber word indices —
        a year-old chunk map would target the wrong words.

        Assembled from two ``values_list`` queries rather than through the
        serializer, for the reason ``SegmentTranscriptView`` gives — the payload is
        mechanical and a transcript can carry thousands of words.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - segments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChunkSpan'
          description: ''
  /api/segments/{id}/transcript/:
    get:
      operationId: segment_transcript_retrieve
      description: |-
        ``GET /api/segments/{id}/transcript/`` — the whole word array.

        Content-addressed by ``Transcript.version``: an approved correction bumps
        the version, so the client asks for a new ``?v=`` rather than revalidating.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - segments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
          description: ''
  /api/surahs/:
    get:
      operationId: surahs_list
      description: '``GET /api/surahs/`` — all 114, unpaginated, with segment counts.'
      tags:
      - surahs
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurahList'
          description: ''
  /api/surahs/{number}/:
    get:
      operationId: surah_retrieve
      description: '``GET /api/surahs/{n}/?page=`` — the surah plus one page of ayahs.'
      parameters:
      - in: path
        name: number
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based, 20 ayahs per page.
      tags:
      - surahs
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurahDetail'
          description: ''
  /api/topics/:
    get:
      operationId: topics_list
      description: |-
        ``GET /api/topics/`` — the published topics only.

        An unpublished topic is an unreviewed cluster label, so it is invisible
        rather than merely unlinked: nothing about it leaves the backend. Which is
        also why this is not immutable: publishing is an editorial decision, and an
        immutable response would mean unpublishing never reaches anyone who already
        looked (API_CONTRACT.md amendment 4).
      tags:
      - topics
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicList'
          description: ''
  /api/topics/{slug}/:
    get:
      operationId: topic_retrieve
      description: |-
        ``GET /api/topics/{slug}/`` — the topic and its best passages.

        Cached like the list for the same reason: the publish gate has to be able
        to close again.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - topics
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
          description: ''
components:
  schemas:
    AyahDetail:
      type: object
      description: '``GET /api/ayahs/{surah}/{ayah}/`` — the verse and what covers
        it.'
      properties:
        surah:
          type: integer
        number:
          type: integer
          maximum: 32767
          minimum: 0
        text_uthmani:
          type: string
        text_imlaei:
          type: string
        juz:
          type: integer
          maximum: 32767
          minimum: 0
        page:
          type: integer
          maximum: 32767
          minimum: 0
          description: Madani mushaf page, 1-604.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/CoveringSegment'
          readOnly: true
      required:
      - juz
      - number
      - page
      - segments
      - surah
      - text_imlaei
      - text_uthmani
    AyahMatch:
      type: object
      description: An exact verse resolved from the query itself, shown above the
        hits.
      properties:
        surah:
          type: integer
        number:
          type: integer
        text_uthmani:
          type: string
        surah_name_ar:
          type: string
      required:
      - number
      - surah
      - surah_name_ar
      - text_uthmani
    AyahPage:
      type: object
      description: 'The ``ayahs`` envelope: a fixed-size page, not a DRF paginator
        shape.'
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SurahAyah'
      required:
      - count
      - page
      - page_size
      - results
    AyahSegmentRef:
      type: object
      description: |-
        A covering segment as listed on a surah page — just enough to link to it.

        Serialized from the ``.values()`` dicts the view fans out, not from model
        instances, so the whole page costs one segment query.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - id
      - kind
      - title
    ChunkResult:
      type: object
      description: |-
        The search-result shape, reused wherever chunks are surfaced (topics)
        so one renderer on the frontend handles all of them.
        Mirrors :class:`search.services.SearchResult`.
      properties:
        chunk_id:
          type: integer
        segment_id:
          type: integer
        segment_title:
          type: string
        surah:
          type: integer
          nullable: true
        ayah_start:
          type: integer
          nullable: true
        ayah_end:
          type: integer
          nullable: true
        kind:
          type: string
        text:
          type: string
        start_ms:
          type: integer
        end_ms:
          type: integer
      required:
      - ayah_end
      - ayah_start
      - chunk_id
      - end_ms
      - kind
      - segment_id
      - segment_title
      - start_ms
      - surah
      - text
    ChunkSpan:
      type: object
      description: |-
        One row of ``GET /api/segments/{id}/chunks/``.

        The map from a word to the passage that holds it: the correction UI lets a
        reader select words in the transcript and has to name a ``chunk_id`` when
        it posts, so it needs the chunks' word ranges. ``word_start``/``word_end``
        are inclusive ``TranscriptWord.idx`` values — the same transcript-wide
        indices ``POST /api/corrections/`` takes — and are null only for a chunk
        whose span holds no aligned words.
      properties:
        chunk_id:
          type: integer
        start_ms:
          type: integer
        end_ms:
          type: integer
        word_start:
          type: integer
          nullable: true
        word_end:
          type: integer
          nullable: true
      required:
      - chunk_id
      - end_ms
      - start_ms
      - word_end
      - word_start
    ClipCreateRequest:
      type: object
      description: |-
        ``POST /api/clips/``. Rendering is somebody's CPU, so the range is
        checked against the segment before a job is ever created.
      properties:
        segment_id:
          type: integer
        start_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        end_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        preset:
          $ref: '#/components/schemas/PresetEnum'
        output:
          $ref: '#/components/schemas/ClipOutputEnum'
      required:
      - end_ms
      - preset
      - segment_id
      - start_ms
    ClipDetail:
      type: object
      description: |-
        ``GET /api/clips/{id}/``. Exactly one of ``video_url``/``audio_url``
        appears once the render finishes (which one is set by the job's ``output``);
        a queued or failed job has neither.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/ClipStatusEnum'
        output:
          $ref: '#/components/schemas/ClipOutputEnum'
        video_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        audio_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        media_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        download_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        download_filename:
          type: string
          nullable: true
          readOnly: true
      required:
      - audio_url
      - download_filename
      - download_url
      - id
      - media_url
      - video_url
    ClipOutputEnum:
      enum:
      - video
      - audio
      type: string
      description: |-
        * `video` - Video
        * `audio` - Audio
    ClipStatus:
      type: object
      description: 'The body of both clip POST outcomes: created, or already queued.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/ClipStatusEnum'
      required:
      - id
    ClipStatusEnum:
      enum:
      - queued
      - rendering
      - done
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `rendering` - Rendering
        * `done` - Done
        * `failed` - Failed
    CorrectionCreateRequest:
      type: object
      description: |-
        ``POST /api/corrections/``. Word offsets index ``TranscriptWord.idx``;
        a one-word fix has ``word_start == word_end``.

        The range is checked against the named chunk's own words here, not only at
        approval time. :func:`corpus.corrections.approve` refuses a range that
        reaches outside its chunk, so accepting one at submission would queue a
        suggestion that no reviewer can ever act on: a dead letter that costs the
        submitter their rate limit and the reviewer a decision they cannot make.
      properties:
        chunk_id:
          type: integer
        word_start:
          type: integer
          maximum: 2147483647
          minimum: 0
        word_end:
          type: integer
          maximum: 2147483647
          minimum: 0
        suggested_text:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - chunk_id
      - suggested_text
      - word_end
      - word_start
    CorrectionCreated:
      type: object
      description: 'The 201 body: a receipt, nothing the submitter did not already
        send.'
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/CorrectionStatusEnum'
      required:
      - id
    CorrectionStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    CoveringSegment:
      type: object
      description: A segment listed under an ayah it covers.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        title:
          type: string
          maxLength: 255
        ayah_start:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        ayah_end:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        duration_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - duration_ms
      - id
      - kind
    Error:
      type: object
      description: The shape every 4xx in this API uses.
      properties:
        detail:
          type: string
      required:
      - detail
    KindEnum:
      enum:
      - recitation
      - khawatir
      type: string
      description: |-
        * `recitation` - Recitation
        * `khawatir` - Khawatir
    PresetEnum:
      enum:
      - classic
      - night
      - light
      type: string
      description: |-
        * `classic` - Classic
        * `night` - Night
        * `light` - Light
    RevelationPlaceEnum:
      enum:
      - makkah
      - madinah
      type: string
      description: |-
        * `makkah` - Makkah
        * `madinah` - Madinah
    SearchResponse:
      type: object
      description: '``GET /api/search/`` — mirrors :class:`search.services.SearchResponse`.'
      properties:
        query:
          type: string
        ayah_matches:
          type: array
          items:
            $ref: '#/components/schemas/AyahMatch'
        verse_matches:
          type: array
          items:
            $ref: '#/components/schemas/VerseMatch'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChunkResult'
        page:
          type: integer
        total:
          type: integer
      required:
      - ayah_matches
      - page
      - query
      - results
      - total
      - verse_matches
    SegmentDetail:
      type: object
      description: |-
        ``GET /api/segments/{id}/``. Requires ``select_related`` on ``audio``,
        ``source`` and ``transcript``.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        title:
          type: string
          maxLength: 255
        surah:
          type: integer
          nullable: true
        ayah_start:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        ayah_end:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        duration_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        ordinal:
          type: integer
          maximum: 2147483647
          minimum: 0
        audio_url:
          type: string
          format: uri
          readOnly: true
        waveform_url:
          type: string
          format: uri
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceBrief'
          readOnly: true
        transcript_version:
          type: integer
          nullable: true
          readOnly: true
        is_human_reviewed:
          type: boolean
          readOnly: true
      required:
      - audio_url
      - duration_ms
      - id
      - is_human_reviewed
      - kind
      - source
      - surah
      - transcript_version
      - waveform_url
    SourceBrief:
      type: object
      description: Provenance line shown next to a segment.
      properties:
        title:
          type: string
          maxLength: 255
        kind:
          type: string
          maxLength: 50
      required:
      - kind
      - title
    SurahAyah:
      type: object
      description: |-
        One ayah inside a paginated surah page.

        ``segments`` is capped at ``views.MAX_AYAH_SEGMENTS``; ``segment_count`` is
        the uncapped total.
      properties:
        number:
          type: integer
          maximum: 32767
          minimum: 0
        text_uthmani:
          type: string
        juz:
          type: integer
          maximum: 32767
          minimum: 0
        page:
          type: integer
          maximum: 32767
          minimum: 0
          description: Madani mushaf page, 1-604.
        sajda:
          type: boolean
        segment_count:
          type: integer
          readOnly: true
        segments:
          type: array
          items:
            $ref: '#/components/schemas/AyahSegmentRef'
          readOnly: true
      required:
      - juz
      - number
      - page
      - segment_count
      - segments
      - text_uthmani
    SurahDetail:
      type: object
      description: '``GET /api/surahs/{n}/`` — surah head plus one page of its ayahs.'
      properties:
        number:
          type: integer
        name_ar:
          type: string
        name_en:
          type: string
        ayah_count:
          type: integer
        revelation_place:
          $ref: '#/components/schemas/RevelationPlaceEnum'
        ayahs:
          $ref: '#/components/schemas/AyahPage'
      required:
      - ayah_count
      - ayahs
      - name_ar
      - name_en
      - number
      - revelation_place
    SurahList:
      type: object
      description: One row of ``GET /api/surahs/``.
      properties:
        number:
          type: integer
          maximum: 32767
          minimum: 0
        name_ar:
          type: string
          maxLength: 100
        name_ar_plain:
          type: string
          description: name_ar passed through corpus.arabic.normalize_for_index.
          maxLength: 100
        name_en:
          type: string
          maxLength: 100
        ayah_count:
          type: integer
          maximum: 32767
          minimum: 0
        revelation_place:
          $ref: '#/components/schemas/RevelationPlaceEnum'
        segment_count:
          type: integer
          readOnly: true
      required:
      - ayah_count
      - name_ar
      - name_ar_plain
      - name_en
      - number
      - revelation_place
      - segment_count
    TopicDetail:
      type: object
      description: |-
        ``GET /api/topics/{slug}/``. The view attaches ``chunks`` — the topic's
        passages, best match first — before serialization.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name_ar:
          type: string
          maxLength: 200
        description_ar:
          type: string
        chunk_count:
          type: integer
          readOnly: true
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ChunkResult'
          readOnly: true
      required:
      - chunk_count
      - chunks
      - name_ar
      - slug
    TopicList:
      type: object
      description: One row of ``GET /api/topics/``.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name_ar:
          type: string
          maxLength: 200
        description_ar:
          type: string
        chunk_count:
          type: integer
          readOnly: true
      required:
      - chunk_count
      - name_ar
      - slug
    Transcript:
      type: object
      description: |-
        ``GET /api/segments/{id}/transcript/``.

        Declared for the schema only: the view assembles the word list straight
        from ``values_list`` because running six thousand rows through a serializer
        per request is pure overhead for a payload this mechanical.
      properties:
        version:
          type: integer
        engine:
          type: string
        is_human_reviewed:
          type: boolean
        words:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptWord'
      required:
      - engine
      - is_human_reviewed
      - version
      - words
    TranscriptWord:
      type: object
      description: '``i`` index, ``t`` text, ``s``/``e`` start/end ms, ``c`` confidence.'
      properties:
        i:
          type: integer
        t:
          type: string
        s:
          type: integer
        e:
          type: integer
        c:
          type: number
          format: double
          nullable: true
      required:
      - c
      - e
      - i
      - s
      - t
    VerseMatch:
      type: object
      description: A mushaf verse found by full-text search over the canonical text.
      properties:
        surah:
          type: integer
        number:
          type: integer
        text_uthmani:
          type: string
        surah_name_ar:
          type: string
        juz:
          type: integer
        page:
          type: integer
      required:
      - juz
      - number
      - page
      - surah
      - surah_name_ar
      - text_uthmani
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
