services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shaarawy_prod_db
    restart: always
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shaarawy_prod_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: shaarawy_prod_meilisearch
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - meili_prod_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: shaarawy_prod_backend
    restart: always
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - AUDIO_S3_ENDPOINT_URL=${AUDIO_S3_ENDPOINT_URL}
      - AUDIO_S3_BUCKET=${AUDIO_S3_BUCKET:-shaarawy}
      - AUDIO_S3_ACCESS_KEY_ID=${AUDIO_S3_ACCESS_KEY_ID}
      - AUDIO_S3_SECRET_ACCESS_KEY=${AUDIO_S3_SECRET_ACCESS_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  celery_worker:
    <<: *backend
    container_name: shaarawy_prod_celery_worker
    command: celery -A core worker -l info -Q celery

  celery_beat:
    <<: *backend
    container_name: shaarawy_prod_celery_beat
    command: celery -A core beat -l info

  # The ASR/alignment pipeline worker runs on a GPU host with pipeline/
  # requirements installed; it consumes the dedicated "pipeline" queue.
  # Point CELERY_BROKER_URL at this stack's redis and run:
  #   celery -A pipeline.celery_app worker -Q pipeline
  # It is intentionally not part of this compose file.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: shaarawy_prod_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_API_URL=http://backend:8000/api
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: shaarawy_prod_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_prod_data:
  redis_prod_data:
  meili_prod_data:
  caddy_prod_data:
  caddy_prod_config:
